env = false
telemetry = false

[install]
exact = true
globalStore = true
linker = "isolated"
publicHoistPattern = ["tsx"]
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = [
  "@exercode/problem-utils",
  "@exercode/problem-utils-browser",
  "@exercode/problem-utils-llm",
  "@openai/codex",
  "@willbooster-private/agentic-workflows",
  "@willbooster-private/ai-ocr",
  "@willbooster-private/code-analyzer",
  "@willbooster-private/judge",
  "@willbooster-private/llm-proxy",
  "@willbooster-private/review-booster",
  "@willbooster-private/slidev-theme-willbooster",
  "@willbooster/babel-configs",
  "@willbooster/biome-config",
  "@willbooster/eslint-config-blitz-next",
  "@willbooster/eslint-config-js",
  "@willbooster/eslint-config-js-react",
  "@willbooster/eslint-config-next",
  "@willbooster/eslint-config-ts",
  "@willbooster/eslint-config-ts-react",
  "@willbooster/monaco-loader",
  "@willbooster/monaco-react",
  "@willbooster/oxfmt-config",
  "@willbooster/oxlint-config",
  "@willbooster/prettier-config",
  "@willbooster/react-frame-component",
  "@willbooster/renovate-config",
  "@willbooster/shared-lib",
  "@willbooster/shared-lib-blitz-next",
  "@willbooster/shared-lib-next",
  "@willbooster/shared-lib-node",
  "@willbooster/shared-lib-react",
  "@willbooster/tree-sitter-bash",
  "@willbooster/tree-sitter-c",
  "@willbooster/tree-sitter-c-sharp",
  "@willbooster/tree-sitter-cpp",
  "@willbooster/tree-sitter-css",
  "@willbooster/tree-sitter-dart",
  "@willbooster/tree-sitter-embedded-template",
  "@willbooster/tree-sitter-go",
  "@willbooster/tree-sitter-haskell",
  "@willbooster/tree-sitter-html",
  "@willbooster/tree-sitter-java",
  "@willbooster/tree-sitter-javascript",
  "@willbooster/tree-sitter-kotlin",
  "@willbooster/tree-sitter-markdown",
  "@willbooster/tree-sitter-php",
  "@willbooster/tree-sitter-python",
  "@willbooster/tree-sitter-ruby",
  "@willbooster/tree-sitter-rust",
  "@willbooster/tree-sitter-typescript",
  "@willbooster/tree-sitter-xml",
  "@willbooster/tree-sitter-zig",
  "@willbooster/wb",
  "@willbooster/wbfy",
  "@willbooster/web-tree-sitter",
  "agent-runtime-kit",
  "at-decorators",
  "better-auth-email-otp-reliable",
  "build-ts",
  "code-gauge",
  "code-gauge-darwin-arm64",
  "code-gauge-darwin-x64",
  "code-gauge-linux-arm64-gnu",
  "code-gauge-linux-arm64-musl",
  "code-gauge-linux-x64-gnu",
  "code-gauge-linux-x64-musl",
  "commitkv",
  "gen-i18n-ts",
  "minimal-promise-pool",
  "one-way-git-sync",
  "slidev-check",
  "tokzip",
  "vinext-progress",
  "wbfy",
  "yarn-plugin-auto-install",
]

[fmt]
flavor = "oxfmt"
printWidth = 120
singleQuote = true
sortImports = true
sortPackageJson = true
trailingComma = "es5"
ignorePatterns = [
  "**/.agents/**",
  "**/.claude/**",
  "**/.devcontainer/**",
  "**/.idea/AugmentWebviewStateStore.xml",
  "**/.idea/copilot*/**",
  "**/.playwright-cli/**",
  "**/.serena/**",
  "**/.tmp/**",
  "**/.venv/**",
  "**/.yarn/**",
  "**/3rd-party/**",
  "**/@types/**",
  "**/@willbooster/**",
  "**/__generated__/**",
  "**/android/**",
  "**/bin/**",
  "**/build/**",
  "**/coverage/**",
  "**/dist/**",
  "**/ios/**",
  "**/no-format/**",
  "**/node_modules/**",
  "**/temp/**",
  "**/tmp/**",
  "**/test-fixtures/**",
  "**/test-results/**",
  "**/test/fixtures/**",
  "**/.aider*",
  "**/.env.production",
  "**/.pnp.js",
  "**/*/mount/*.hash",
  "**/*.d.ts",
  "**/*.java",
  "**/*.min.*js",
  "**/src/grammar.json",
  "**/src/node-types.json",
]

[[fmt.overrides]]
files = ["**/oxlint.config.ts"]
options = { sortImports = false }
